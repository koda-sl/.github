name: Notify Slack — Issue Ready

on:
  projects_v2_item:
    types: [edited]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    if: >-
      github.event.changes.field_value.field_node_id == 'PVTSSF_lADOCeB7e84BXdSuzhSqAYU'
      && github.event.changes.field_value.field_type == 'single_select'
    steps:
      - name: Check if moved to Ready
        id: check
        env:
          OPTION_ID: ${{ github.event.changes.field_value.to.id }}
        run: |
          if [ "$OPTION_ID" != "61e4505c" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch issue details
        if: steps.check.outputs.skip != 'true'
        id: issue
        env:
          GH_TOKEN: ${{ secrets.PROJECT_READER_TOKEN }}
          NODE_ID: ${{ github.event.projects_v2_item.node_id }}
        run: |
          RESULT=$(gh api graphql -f query='
            query($nodeId: ID!) {
              node(id: $nodeId) {
                ... on ProjectV2Item {
                  content {
                    ... on Issue {
                      title
                      number
                      url
                      body
                      labels(first: 10) {
                        nodes { name }
                      }
                    }
                  }
                  priority: fieldValueByName(name: "Project Priority") {
                    ... on ProjectV2ItemFieldSingleSelectValue {
                      name
                      optionId
                    }
                  }
                  size: fieldValueByName(name: "Size") {
                    ... on ProjectV2ItemFieldSingleSelectValue {
                      name
                    }
                  }
                }
              }
            }
          ' -f nodeId="$NODE_ID")

          TITLE=$(echo "$RESULT" | jq -r '.data.node.content.title // "Untitled"')
          NUMBER=$(echo "$RESULT" | jq -r '.data.node.content.number // "?"')
          URL=$(echo "$RESULT" | jq -r '.data.node.content.url // ""')
          BODY=$(echo "$RESULT" | jq -r '.data.node.content.body // ""')
          PRIORITY=$(echo "$RESULT" | jq -r '.data.node.priority.name // ""')
          SIZE=$(echo "$RESULT" | jq -r '.data.node.size.name // ""')
          LABELS=$(echo "$RESULT" | jq -r '[.data.node.content.labels.nodes[].name] | join(", ") // ""')

          EXCERPT=$(echo "$BODY" | awk '
            BEGIN { found=0; count=0 }
            /^## / { count++; if(count>1) exit }
            { if(count>=1 || NR<=3) { found=1; print } }
          ' | head -c 500)

          {
            echo "title<<EOFVAL"
            echo "$TITLE"
            echo "EOFVAL"
            echo "number=$NUMBER"
            echo "url=$URL"
            echo "priority=$PRIORITY"
            echo "size=$SIZE"
            echo "labels=$LABELS"
            echo "excerpt<<EOFVAL"
            echo "$EXCERPT"
            echo "EOFVAL"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch board state
        if: steps.check.outputs.skip != 'true'
        id: board
        env:
          GH_TOKEN: ${{ secrets.PROJECT_READER_TOKEN }}
        run: |
          RESULT=$(gh api graphql -f query='
            query {
              node(id: "PVT_kwDOCeB7e84BXdSu") {
                ... on ProjectV2 {
                  items(first: 100) {
                    nodes {
                      updatedAt
                      status: fieldValueByName(name: "Status") {
                        ... on ProjectV2ItemFieldSingleSelectValue { optionId }
                      }
                      priority: fieldValueByName(name: "Project Priority") {
                        ... on ProjectV2ItemFieldSingleSelectValue { name }
                      }
                      content {
                        ... on Issue {
                          assignees(first: 5) { nodes { login } }
                        }
                      }
                    }
                  }
                }
              }
            }
          ')

          FOOTER=$(echo "$RESULT" | jq -r '
            .data.node.items.nodes as $items
            | ($items | map(select(.status.optionId == "61e4505c"))) as $ready
            | ($items | map(select(.status.optionId == "47fc9ee4"))) as $inprog
            | ($ready | length) as $total
            | ($ready | map(select(.priority.name == "P0")) | length) as $p0
            | ($ready | map(select(.priority.name == "P1")) | length) as $p1
            | ($ready | map(select(.priority.name == "P2")) | length) as $p2
            | ($ready | map(select(.priority.name == "P3")) | length) as $p3
            | (if ($ready | length) > 0
                then ($ready | map(.updatedAt | fromdateiso8601) | min) as $oe
                  | ((now - $oe) / 86400 | floor)
                else 0 end) as $oldest
            | ($inprog | length) as $ic
            | ($inprog
                | map(.content.assignees.nodes // [] | map(.login))
                | flatten | unique) as $assignees
            | (if $p0 > 0 or $oldest > 14 then "🔥"
               elif $total > 8 or $oldest > 10 then "🟠"
               elif $total >= 4 or $oldest >= 5 then "🟡"
               else "✅" end) as $emoji
            | ([
                (if $p0 > 0 then "\($p0)× P0" else empty end),
                (if $p1 > 0 then "\($p1)× P1" else empty end),
                (if $p2 > 0 then "\($p2)× P2" else empty end),
                (if $p3 > 0 then "\($p3)× P3" else empty end)
              ] | if length == 0 then "no priorities set" else join(", ") end) as $breakdown
            | (if ($assignees | length) > 0 then ($assignees | map("@" + .) | join(", "))
               elif $ic > 0 then "unassigned"
               else "*nobody*" end) as $who
            | "\($emoji) *Board:* Ready \($total) (\($breakdown)) · oldest \($oldest)d · In progress \($ic) (\($who)) · <https://github.com/orgs/koda-sl/projects/3|open Kanban>"
          ')

          {
            echo "footer<<EOFVAL"
            echo "$FOOTER"
            echo "EOFVAL"
          } >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        if: steps.check.outputs.skip != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_GENERAL_WEBHOOK_URL }}
          TITLE: ${{ steps.issue.outputs.title }}
          NUMBER: ${{ steps.issue.outputs.number }}
          URL: ${{ steps.issue.outputs.url }}
          PRIORITY: ${{ steps.issue.outputs.priority }}
          SIZE: ${{ steps.issue.outputs.size }}
          LABELS: ${{ steps.issue.outputs.labels }}
          EXCERPT: ${{ steps.issue.outputs.excerpt }}
          FOOTER: ${{ steps.board.outputs.footer }}
        run: |
          set -u

          QUOTED_EXCERPT=""
          if [ -n "$EXCERPT" ]; then
            QUOTED_EXCERPT=$(printf '%s' "$EXCERPT" | sed 's/^/> /' | head -c 600)
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg number "$NUMBER" \
            --arg url "$URL" \
            --arg priority "$PRIORITY" \
            --arg size "$SIZE" \
            --arg labels "$LABELS" \
            --arg excerpt "$QUOTED_EXCERPT" \
            --arg footer "$FOOTER" \
            '
            def link: "<\($url)|\($title)> (#\($number))";
            def meta:
              (if $size != "" then "*Size:* \($size)" else "*Size:* —" end)
              + (if $labels != "" then " · *Labels:* \($labels)" else "" end);
            def divider: "━━━━━━━━━━━━━━━━━━━━━━━━━━━━";
            def body: if $excerpt != "" then "\n\n\($excerpt)" else "" end;
            def board_footer: "\n\n\($footer)";

            if $priority == "P0" then
              {text: "🚨🚨 *PRIORITY ZERO — 24h SLA* 🚨🚨\n\(divider)\n\(link)\n\(meta)\(body)\n\n⏰ *This must be addressed within 24 hours.*\(board_footer)"}
            elif $priority == "P1" then
              {text: "🔴 *P1 — Ready for work*\n\(divider)\n\(link)\n\(meta)\(body)\(board_footer)"}
            elif $priority == "P2" then
              {text: "🟡 *P2 — Ready for work*\n\(link)\n\(meta)\(body)\(board_footer)"}
            elif $priority == "P3" then
              {text: "🟢 *P3 — Ready for work*\n\(link)\(if $size != "" then " · Size: \($size)" else "" end)\(board_footer)"}
            else
              {text: "⚪ *Ready for work* (no priority set)\n\(link)\(board_footer)"}
            end
          ')

          curl -sS -X POST "${SLACK_WEBHOOK_URL}" \
            -H 'Content-Type: application/json' \
            -d "${PAYLOAD}"
